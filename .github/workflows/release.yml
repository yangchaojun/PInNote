name: Release

# 打 tag 即发版：git tag v0.2.0 && git push origin v0.2.0
# workflow_dispatch 只构建并上传产物，不发 release，用来验证流水线。
#
# 只有 macOS：pin-only 形态依赖 NSStatusItem 与原生 frame resize，Windows/Linux 出界。
# 产物（dist/）：universal .zip + .dmg + update-darwin-{arm64,amd64}.json（自更新清单，
# 含 ed25519 签名，由 mygo build 用 MYGO_UPDATER_PRIVATE_KEY 签出）+ 差量包。
# 自更新只信编译期钉死在 mygo.json updates.publicKey 的公钥（ADR-0003 D5/D6 延续）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "写入构建的版本号（不带 v）。留空则用 mygo.json 的 version"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: PinNote
  # 必须与 go.mod 里 mygo 的版本一致，否则 CI 与本地构建行为漂移。
  MYGO_VERSION: v0.6.3

jobs:
  release:
    name: Build and publish macOS universal
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          config_version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          number="$INPUT_VERSION"
          publish=false
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              case "$tag" in
                v[0-9]*.[0-9]*) number="${tag#v}" ;;
                *) echo "::error::tag '${tag}' 不符合 vX.Y.Z"; exit 1 ;;
              esac
              publish=true
              ;;
          esac
          number="${number:-$config_version}"
          case "$number" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::version '${number}' 不符合 x.y.z"; exit 1 ;;
          esac
          if [ "$number" != "$config_version" ]; then
            echo "::notice::版本 ${number} 与 mygo.json 的 ${config_version} 不一致，产物按 ${number} 写入"
          fi
          {
            echo "tag=v${number}"
            echo "number=${number}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -euo pipefail
          go vet .
          go test -count=1 .

      # 单一版本事实源：同一个 number 写进 mygo.json，mygo build 会把它注入
      # bundle 的 Info.plist 与更新清单（ADR-0003 B3 的 mygo 形态）。
      - name: Stamp version into the config
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          python3 - "$NUMBER" <<'PY'
          import json, sys
          number = sys.argv[1]
          with open("mygo.json") as f:
              config = json.load(f)
          config["version"] = number
          with open("mygo.json", "w") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Install mygo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@"$MYGO_VERSION"

      # 自更新走 mygo build 的 ed25519 签名（对清单里每个产物）。
      # 密钥对沿用 Wails 时代那对：Secret 里是 hex 私钥，这里转成 mygo 要的 base64。
      # Secret 缺失时 tag 构建直接失败——production 构建拒绝任何验不了的产物（ADR-0003 D6）。
      - name: Convert update signing key
        id: key
        env:
          PINNOTE_UPDATE_KEY: ${{ secrets.PINNOTE_UPDATE_KEY }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          set -euo pipefail
          if [ -z "${PINNOTE_UPDATE_KEY}" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::缺少 Secret PINNOTE_UPDATE_KEY：发版必须带更新签名私钥"
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf %s "$PINNOTE_UPDATE_KEY" | xxd -r -p | base64 > /tmp/mygo-update-key.b64
          # 公钥与 mygo.json 对齐：对不上等于「所有客户端从此收不到更新」，
          # 而报错完全指不到真正的原因，所以在这里就拦住。
          expected=$(python3 -c 'import json; print(json.load(open("mygo.json"))["updates"]["publicKey"])')
          actual=$(python3 -c '
          import base64, hashlib, struct
          raw = open("/tmp/mygo-update-key.b64","rb").read()
          # ed25519 私钥 64 字节：后 32 字节即公钥
          priv = base64.b64decode(raw)
          print(base64.b64encode(priv[32:]).decode())')
          if [ "$expected" != "$actual" ]; then
            echo "::error::Secret PINNOTE_UPDATE_KEY 与 mygo.json updates.publicKey 不是同一对密钥"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # universal 而不是 uname -m：一条 release 一个主产物，Intel 与 Apple Silicon 共用，
      # 否则 amd64 用户永远匹配不到清单（B4 的 mygo 形态：每个 target 一份 update-*.json）。
      - name: Build
        run: |
          set -euo pipefail
          if [ -f /tmp/mygo-update-key.b64 ]; then
            export MYGO_UPDATER_PRIVATE_KEY="$(cat /tmp/mygo-update-key.b64)"
          fi
          "$(go env GOPATH)/bin/mygo" build -platform darwin/universal

      # 换包后 LaunchServices 按 CFBundleExecutable 找入口；这里指错就等于
      # 「更新完成，双击打不开」，必须在发版前拦住（ADR-0003 B2）。
      - name: Verify bundle
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          app="dist/${APP_NAME}.app"
          test -d "$app" || { ls -R dist | head -40; echo "::error::找不到 ${app}"; exit 1; }
          entry=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "${app}/Contents/Info.plist")
          test -x "${app}/Contents/MacOS/${entry}" || {
            echo "::error::CFBundleExecutable=${entry} 在 Contents/MacOS 里不存在或不可执行"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Summarize artifacts
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          ls dist > /tmp/dist-list.txt
          if ! grep -q "^update-darwin-arm64.json$" /tmp/dist-list.txt; then
            echo "::warning::缺少 update-darwin-arm64.json（更新签名被跳过？）：这个版本装不上自动更新"
          fi
          {
            echo "- 版本：v${NUMBER}"
            echo "- 架构：universal（arm64 + amd64 同一产物）"
            echo "- 签名：ad-hoc，未经 Developer ID 签名与 notarize"
            echo "- 文件：\`$(ls dist | tr '\n' ' ')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifacts
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.tag }}-macOS-build
          path: dist/
          if-no-files-found: error

      # 自更新 feed 读 latest release 的 update-darwin-*.json；清单、zip、dmg、差量包一起上。
      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.tag }}"
          prerelease: auto
          files: |
            dist/*.zip
            dist/*.dmg
            dist/update-*.json
            dist/*.delta
          body: |
            ## 安装
            1. 下载 `.dmg`（拖进 Applications）或 `.zip`：`ditto -x -k <zip 文件名> /Applications`。
            2. 构建使用 ad-hoc 签名，未经 Apple notarize，首次打开会被 Gatekeeper 拦下：**右键 → 打开** 确认一次即可；若仍被拒：
               `xattr -dr com.apple.quarantine /Applications/PinNote.app`
            3. universal 产物在 Apple Silicon 与 Intel 上通用；装好之后应用内会自己检查并升级到更新的 release
               （`update-darwin-*.json` 清单带 ed25519 签名，客户端只装验得过签名的包）。

            需要 Developer ID 签名 + notarize，要先配证书与 notary API 凭据（mygo build 同样支持）。
